<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Discord Patch Bot discount embed example</title>
  <desc id="desc">Static mock of an automatic game discount Discord embed.</desc>
  <rect width="760" height="360" rx="22" fill="#111827"/>
  <rect x="54" y="42" width="652" height="276" rx="14" fill="#0f172a" stroke="#334155"/>
  <rect x="54" y="42" width="8" height="276" rx="4" fill="#f97316"/>
  <rect x="552" y="82" width="114" height="114" rx="16" fill="#1f2937" stroke="#475569"/>
  <text x="609" y="130" text-anchor="middle" fill="#fed7aa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">SALE</text>
  <text x="609" y="162" text-anchor="middle" fill="#fb923c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">-50%</text>
  <text x="84" y="88" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Reducere Steam</text>
  <text x="84" y="122" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Filtrata dupa magazin, procent minim si pret maxim.</text>
  <text x="84" y="174" fill="#e5e7eb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Example Game: Complete Edition</text>
  <text x="84" y="214" fill="#fb923c" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">9.99 EUR</text>
  <text x="246" y="214" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" text-decoration="line-through">19.99 EUR</text>
  <text x="84" y="254" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Rating, store si limita de pret sunt calculate inainte de trimitere.</text>
  <rect x="84" y="278" width="126" height="30" rx="15" fill="#1f2937"/>
  <text x="147" y="299" text-anchor="middle" fill="#fed7aa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Vezi oferta</text>
</svg>
