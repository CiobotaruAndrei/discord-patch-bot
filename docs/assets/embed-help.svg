<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Discord Patch Bot help embed example</title>
  <desc id="desc">Static mock of the /help Discord embed.</desc>
  <rect width="760" height="360" rx="22" fill="#0f172a"/>
  <rect x="54" y="42" width="652" height="276" rx="14" fill="#111827" stroke="#334155"/>
  <rect x="54" y="42" width="8" height="276" rx="4" fill="#5865f2"/>
  <text x="84" y="88" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Discord Patch Bot - /help</text>
  <text x="84" y="122" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Comenzi rapide pentru update-uri, reduceri si setari server.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">
    <text x="84" y="170" fill="#c4b5fd" font-weight="700">/start updates</text>
    <text x="254" y="170" fill="#e5e7eb">porneste notificarile automate de patch notes</text>
    <text x="84" y="208" fill="#c4b5fd" font-weight="700">/latest reduceri</text>
    <text x="254" y="208" fill="#e5e7eb">afiseaza cele mai bune oferte curente</text>
    <text x="84" y="246" fill="#c4b5fd" font-weight="700">/set games</text>
    <text x="254" y="246" fill="#e5e7eb">alege jocurile urmarite pe server</text>
    <text x="84" y="284" fill="#c4b5fd" font-weight="700">/set stores</text>
    <text x="254" y="284" fill="#e5e7eb">filtreaza magazinele pentru reduceri</text>
  </g>
</svg>
