[package]
name = "discord_patch_bot_logic"
version = "0.1.0"
edition = "2021"

[features]
default = ["magic", "msi", "yara", "archive", "qpdf", "executable", "url-identity", "visual", "disassembly"]
magic = ["dep:magic"]
yara = ["dep:yara"]
archive = ["dep:libarchive2-sys"]
qpdf = ["dep:qpdf"]
executable = ["dep:goblin"]
disassembly = ["dep:capstone"]
url-identity = ["dep:idna", "dep:unicode-security", "dep:publicsuffix"]
visual = ["dep:zxing-cpp", "dep:image"]
msi = ["dep:msi"]

[dependencies]
sha2 = "0.11"
magic = { version = "0.16", optional = true }
yara = { version = "0.32", optional = true, default-features = false, features = ["vendored", "bundled-4_5_5"] }
libarchive2-sys = { version = "0.2", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
qpdf = { version = "0.3.5", default-features = false, features = ["vendored"], optional = true }
goblin = { version = "0.10.7", default-features = false, features = ["pe32", "pe64", "elf32", "elf64", "mach32", "mach64", "endian_fd", "std", "alloc"], optional = true }
idna = { version = "1.1.0", optional = true }
unicode-security = { version = "0.1.2", optional = true }
publicsuffix = { version = "2.3.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
msi = { version = "0.10", optional = true }
capstone = { version = "0.14", optional = true }
zxing-cpp = { version = "0.5", features = ["bundled"], optional = true }

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false }
