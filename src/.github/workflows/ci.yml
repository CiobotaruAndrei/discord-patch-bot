name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run checks
        env:
          MONGO_URI: mongodb://localhost:27017/discord-patch-bot-test
          DISCORD_TOKEN: test_discord_token
          DISCORD_CLIENT_ID: test_discord_client_id
          METRICS_PUBLIC: "true"
        run: npm run check
