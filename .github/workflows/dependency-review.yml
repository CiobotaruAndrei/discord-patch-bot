name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths:
      - "src/package.json"
      - "src/package-lock.json"
      - ".github/dependabot.yml"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether Dependency graph is enabled
        id: dependency-graph
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.get(context.repo);
            const status = data.security_and_analysis?.dependency_graph?.status;
            core.info(`Dependency graph status: ${status || "unknown"}`);
            return status === "enabled";

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.result == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

      - name: Explain dependency review setup
        if: steps.dependency-graph.outputs.result != 'true'
        run: |
          echo "::warning::GitHub Dependency Review is skipped until Dependency graph is enabled in repository security settings. After it is enabled, this workflow runs dependency-review-action as a blocking check."
