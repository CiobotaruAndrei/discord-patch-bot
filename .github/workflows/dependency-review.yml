name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether Dependency graph is enabled
        id: dependency-graph
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.get(context.repo);
            const status = data.security_and_analysis?.dependency_graph?.status;
            core.info(`Dependency graph status: ${status || "unknown"}`);
            return status === "enabled";

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.result == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

      - name: Fail-closed when Dependency graph is disabled
        if: steps.dependency-graph.outputs.result != 'true'
        env:
          ALLOW_NO_DEPENDENCY_GRAPH: ${{ vars.ALLOW_NO_DEPENDENCY_GRAPH }}
        run: |
          if [ "$ALLOW_NO_DEPENDENCY_GRAPH" = "true" ]; then
            echo "::warning::Dependency Review sarit: Dependency graph nu e activat, dar variabila de repo ALLOW_NO_DEPENDENCY_GRAPH=true permite explicit (opt-out asumat)."
            exit 0
          fi
          echo "::error::Dependency Review nu poate rula: Dependency graph nu e activat in Settings > Security. Activeaza-l (recomandat) sau seteaza variabila de repo ALLOW_NO_DEPENDENCY_GRAPH=true ca opt-out explicit. Fail-closed implicit pentru supply chain - un check verde fara analiza reala ar fi inselator."
          exit 1
