name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "src/package.json"
      - "src/package-lock.json"
      - "src/native/Cargo.toml"
      - "src/native/Cargo.lock"

permissions:
  contents: read

jobs:
  audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies (npm)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master 2026-06
        with:
          toolchain: "1.96.0"

      # cargo-audit se compileaza din surse la fiecare rulare (~3 minute) desi versiunea e fixata.
      # Cache-ul pastreaza binarul instalat; nu atinge artefactele proiectului.
      - name: Cache cargo-audit
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src/native
          cache-targets: "false"
          key: cargo-audit-0.22.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      # RUSTSEC-2024-0436 (`paste`, marcat "unmaintained") e singura exceptie, si e ingusta:
      # `paste` e un proc-macro care ruleaza DOAR la compilare si nu emite cod in binarul livrat,
      # deci nu e in suprafata de atac a productiei. Avizul spune ca autorul a arhivat proiectul,
      # nu ca exista un defect. Ajunge in graf doar prin `zxing-cpp` (decodorul de coduri din
      # imagini), care nu are o versiune fara el. Daca vreodata se raporteaza o vulnerabilitate
      # reala in `paste`, aceea primeste alt ID de aviz si pica in continuare aceasta poarta.
      - name: Audit Rust dependencies (cargo audit)
        run: cargo audit --file native/Cargo.lock --deny warnings --ignore RUSTSEC-2024-0436
