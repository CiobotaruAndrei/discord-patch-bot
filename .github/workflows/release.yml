name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v1.0.0 (must already be pushed)"
        required: true
        type: string
      smoke_confirmed:
        description: "Confirm staging smoke + manual Discord smoke passed (see RELEASING.md)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Release gate (smoke confirmation)
        shell: bash
        env:
          SMOKE_CONFIRMED: ${{ inputs.smoke_confirmed }}
        run: |
          if [ "$SMOKE_CONFIRMED" != "true" ]; then
            echo "::error::Release blocat: porneste cu smoke_confirmed=true dupa ce ai rulat staging smoke (npm run smoke:staging + smoke:staging:discord) si checklist-ul manual Discord. Vezi RELEASING.md."
            exit 1
          fi
          echo "Release gate OK. CI + audit ruleaza mai jos; staging smoke real este verificat din artifact (pasul urmator)."

      - name: Verify recent staging smoke run
        id: smoke
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STAGING_SMOKE_MAX_AGE_DAYS: ${{ vars.STAGING_SMOKE_MAX_AGE_DAYS || '7' }}
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const maxAgeDays = Number(process.env.STAGING_SMOKE_MAX_AGE_DAYS || '7');
            const tagRef = process.env.RELEASE_TAG;
            let tagSha;
            try {
              const commit = await github.rest.repos.getCommit({ owner: context.repo.owner, repo: context.repo.repo, ref: tagRef });
              tagSha = commit.data.sha;
            } catch (err) {
              core.setFailed(`Release blocat: nu pot rezolva commit-ul pentru tag-ul '${tagRef}' (${err.message}). Asigura-te ca tag-ul e impins.`);
              return;
            }
            core.info(`Tag '${tagRef}' -> commit ${tagSha}.`);
            const expectedArtifact = `staging-smoke-result-${tagSha}`;
            const now = Date.now();
            const maxAgeMs = maxAgeDays * 86400000;
            const MAX_PAGES = 10;
            let freshCount = 0;
            for (let page = 1; page <= MAX_PAGES; page++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'staging-smoke.yml',
                status: 'success',
                per_page: 100,
                page
              });
              const pageRuns = runs.data.workflow_runs;
              if (pageRuns.length === 0) break;
              for (const run of pageRuns) {
                if (now - new Date(run.updated_at).getTime() > maxAgeMs) continue;
                freshCount++;
                const arts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                const art = arts.data.artifacts.find(a => a.name === expectedArtifact && !a.expired);
                if (art) {
                  core.setOutput('run_id', String(run.id));
                  core.setOutput('artifact_name', expectedArtifact);
                  core.info(`Staging Smoke reusit pe commit-ul tag-ului gasit: run ${run.id} (${run.updated_at}, pagina ${page}), artifact ${expectedArtifact}.`);
                  return;
                }
              }
              const oldest = pageRuns[pageRuns.length - 1];
              if (now - new Date(oldest.created_at).getTime() > maxAgeMs) break;
            }
            if (freshCount === 0) {
              core.setFailed(`Release blocat: nicio rulare Staging Smoke reusita in ultimele ${maxAgeDays} zile. Ruleaza workflow-ul Staging Smoke cu input-ul ref='${tagRef}' inainte de release (RELEASING.md).`);
              return;
            }
            core.setFailed(`Release blocat: nicio rulare Staging Smoke reusita (${freshCount} verificate, cu paginare) nu a testat EXACT commit-ul tag-ului (artifact asteptat: '${expectedArtifact}'). Numele artifactului poarta SHA-ul rezolvat din checkout (git rev-parse HEAD), deci o rulare pe alt branch/ref nu poate trece gate-ul. Ruleaza Staging Smoke cu input-ul ref='${tagRef}' (RELEASING.md).`);

      - name: Download staging smoke result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.smoke.outputs.artifact_name }}
          run-id: ${{ steps.smoke.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: smoke-result

      - name: Assert staging smoke result is a real pass
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const files = ["smoke-result/staging-smoke-http.json", "smoke-result/staging-smoke-discord.json"];
            let failed = false;
            for (const f of files) {
              if (!fs.existsSync(f)) { console.error(`::error::Lipseste ${f} din artifactul de staging smoke.`); failed = true; continue; }
              const r = JSON.parse(fs.readFileSync(f, "utf8"));
              if (r.skipped) { console.error(`::error::${f}: staging smoke a fost SARIT (skipped=true) - seteaza secretele de staging si re-ruleaza.`); failed = true; }
              if (!r.ok) { console.error(`::error::${f}: staging smoke a esuat (ok=false).`); failed = true; }
            }
            if (failed) process.exit(1);
            console.log("Staging smoke result verificat: ambele probe au trecut live.");
          '

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/discord-patch-bot"
          if ! echo "$DISPATCH_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag invalid '$DISPATCH_TAG': asteptat semver vX.Y.Z (optional -prerelease, ex. v1.2.3 sau v1.2.3-rc1)."
            exit 1
          fi
          if echo "$DISPATCH_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            tags="$image:$DISPATCH_TAG"$'\n'"$image:latest"
            echo "::notice::Release stabil $DISPATCH_TAG -> publica si :latest."
          else
            tags="$image:$DISPATCH_TAG"
            echo "::notice::Pre-release $DISPATCH_TAG -> publica DOAR tag-ul, fara :latest."
          fi
          echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          { echo "tags<<EOF"; printf '%s\n' "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Checkout release ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-06
        with:
          toolchain: "1.96.0"
          components: clippy

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Validate Rust (clippy + tests)
        working-directory: src
        run: |
          cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --manifest-path native/Cargo.toml -p discord_patch_bot_logic --quiet

      - name: Run release checks
        working-directory: src
        env:
          MONGO_URI: mongodb://localhost:27017/discord-patch-bot-release
          DISCORD_TOKEN: release_check_token
          DISCORD_CLIENT_ID: release_check_client_id
          METRICS_PUBLIC: "true"
        run: npm run check

      - name: Audit runtime dependencies
        working-directory: src
        run: npm audit --omit=dev --audit-level=moderate

      - name: Extract release notes
        working-directory: src
        run: node dist/scripts/extract-release-notes.js "${{ steps.release.outputs.tag }}" ../release-notes.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.release.outputs.tags }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
