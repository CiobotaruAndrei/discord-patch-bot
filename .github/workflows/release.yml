name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v1.0.0"
        required: true
        type: string
      smoke_confirmed:
        description: "Confirm staging smoke + manual Discord smoke passed (see RELEASING.md)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          tag="$GITHUB_REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/discord-patch-bot" >> "$GITHUB_OUTPUT"

      - name: Release gate (smoke confirmation)
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SMOKE_CONFIRMED: ${{ inputs.smoke_confirmed }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SMOKE_CONFIRMED" != "true" ]; then
            echo "::error::Release blocat: porneste prin workflow_dispatch cu smoke_confirmed=true dupa ce ai rulat staging smoke (npm run smoke:staging + smoke:staging:discord) si checklist-ul manual Discord. Vezi RELEASING.md."
            exit 1
          fi
          echo "Release gate OK. CI + audit ruleaza mai jos; staging smoke + manual Discord smoke sunt responsabilitatea releaser-ului (RELEASING.md)."

      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Run release checks
        working-directory: src
        run: npm run check

      - name: Audit runtime dependencies
        working-directory: src
        run: npm audit --omit=dev --audit-level=moderate

      - name: Extract release notes
        working-directory: src
        run: node dist/scripts/extract-release-notes.js "${{ steps.release.outputs.tag }}" ../release-notes.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
            ${{ steps.release.outputs.image }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
