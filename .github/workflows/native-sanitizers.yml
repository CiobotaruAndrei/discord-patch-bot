name: Native sanitizers

# Sanitizerele cer toolchain nightly si recompileaza tot stratul C/C++ cu instrumentare, deci
# costa minute. Nu sunt gate de PR: ruleaza noaptea si la cerere. Testele de fuzz propriu-zise
# ruleaza in `check` la fiecare PR (sunt rapide); aici se adauga doar detectia de erori de memorie
# pe care Rust-ul sigur nu o poate da singur, dar wrapper-ele peste libyara, libarchive si qpdf da.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

concurrency:
  group: native-sanitizers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  address-sanitizer:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pachetele insumeaza ~48 MB, iar mirror-ul Azure e inegal: masurat, aceeasi lista se instaleaza
      # in 23s cand merge bine, dar `cmake` a luat 89s si `libclang-dev` a blocat 3,5 minute intr-o
      # rulare care a expirat. Cache-ul pastreaza arhivele .deb, deci la hit `apt-get install` le
      # gaseste local si nu mai descarca nimic. Cheia poarta lista de pachete: daca se schimba, cache-ul
      # se invalideaza singur.
      #
      # Salvarea e conditionata pe main, ca la celelalte cache-uri din repo: cota Actions e 10 GB,
      # iar o copie per branch ar evacua LRU exact intrarile de care depinde rularea urmatoare.
      - name: Restore cache pachete apt (arhive .deb)
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-noble-${{ hashFiles('.github/workflows/native-apt-packages.txt') }}

      - name: Install native library dependencies (libarchive + libyara + libseccomp build deps)
        timeout-minutes: 10
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true
          packages="$(paste -sd' ' "$GITHUB_WORKSPACE/.github/workflows/native-apt-packages.txt")"
          if [ -d ~/apt-archives ]; then
            sudo mkdir -p /var/cache/apt/archives
            sudo cp -n ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          for attempt in 1 2 3; do
            sudo apt-get -o DPkg::Lock::Timeout=120 update && sudo apt-get -o DPkg::Lock::Timeout=120 -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends $packages && break
            echo "apt-get a esuat sau a fost intrerupt (incercarea $attempt din 3); se reia"
            sleep 10
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
          done
          mkdir -p ~/apt-archives
          sudo cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          echo "arhive .deb pastrate pentru rularea urmatoare: $(find ~/apt-archives -name '*.deb' | wc -l)"

      - name: Salveaza cache-ul de pachete apt
        if: github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-noble-${{ hashFiles('.github/workflows/native-apt-packages.txt') }}

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master 2026-06
        with:
          toolchain: nightly
          components: rust-src

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src/native
          cache-on-failure: "true"
          key: sanitizers

      # AddressSanitizer prinde erorile din codul C/C++ legat (libyara, libarchive, qpdf) pe care
      # garantiile Rust nu le acopera: acolo raspunderea pentru memorie e a librariei, nu a
      # compilatorului. Testele de fuzz sunt exact intrarea ostila pe care le hranim.
      - name: Run fuzz corpora under AddressSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            --manifest-path native/Cargo.toml \
            -p discord_patch_bot_logic -p native-inspector \
            --test parser_fuzz --test protocol_fuzz
