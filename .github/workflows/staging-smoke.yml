name: Staging Smoke

on:
  workflow_dispatch:
    inputs:
      # Pentru release: seteaza exact tag-ul vX.Y.Z, ca smoke-ul sa ruleze codul tag-ului
      # indiferent de branch-ul din dropdown-ul de dispatch. Gol = ref-ul curent.
      ref:
        description: "Tag/branch/SHA pe care ruleaza smoke-ul (gol = ref-ul de dispatch)"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  staging-smoke:
    name: Probe staging health and metrics
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve tested commit SHA
        id: smokesha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Probele ruleaza independent (if: !cancelled()): daca proba HTTP pica, cea Discord
      # tot ruleaza, ca artifactul sa aiba diagnostic complet; verdictul final pica job-ul
      # daca oricare dintre rezultate e ok=false.
      - name: Run staging smoke probe (health + metrics)
        id: http-probe
        if: ${{ !cancelled() }}
        run: npm run smoke:staging
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_METRICS_TOKEN: ${{ secrets.STAGING_METRICS_TOKEN }}
          STAGING_SMOKE_RESULT_FILE: ${{ github.workspace }}/staging-smoke-http.json

      - name: Run live Discord smoke (gateway + commands + permissions)
        id: discord-probe
        if: ${{ !cancelled() }}
        run: npm run smoke:staging:discord
        env:
          STAGING_DISCORD_TOKEN: ${{ secrets.STAGING_DISCORD_TOKEN }}
          STAGING_DISCORD_CLIENT_ID: ${{ secrets.STAGING_DISCORD_CLIENT_ID }}
          STAGING_TEST_GUILD_ID: ${{ secrets.STAGING_TEST_GUILD_ID }}
          STAGING_TEST_CHANNEL_ID: ${{ secrets.STAGING_TEST_CHANNEL_ID }}
          STAGING_DISCORD_SEND_TEST: ${{ secrets.STAGING_DISCORD_SEND_TEST }}
          STAGING_DISCORD_SMOKE_RESULT_FILE: ${{ github.workspace }}/staging-smoke-discord.json

      - name: Final verdict (both probes from JSON results)
        if: ${{ !cancelled() }}
        env:
          HTTP_RESULT_FILE: ${{ github.workspace }}/staging-smoke-http.json
          DISCORD_RESULT_FILE: ${{ github.workspace }}/staging-smoke-discord.json
        run: |
          node -e '
            const fs = require("fs");
            const files = [process.env.HTTP_RESULT_FILE, process.env.DISCORD_RESULT_FILE];
            let failed = false;
            for (const file of files) {
              if (!file || !fs.existsSync(file)) {
                console.error(`::error::[staging-smoke] Lipseste fisierul de rezultat ${file} (proba a crapat inainte sa scrie JSON-ul).`);
                failed = true;
                continue;
              }
              const result = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!result.ok) {
                const broken = (result.checks || []).filter(c => !c.ok).map(c => `${c.name}: ${c.detail || "fail"}`).join(" | ");
                console.error(`::error::[staging-smoke] ${result.kind}: ok=false (${broken || "fara detalii"})`);
                failed = true;
              }
            }
            if (failed) process.exit(1);
            console.log("Ambele probe de staging smoke au trecut (sau au fost sarite explicit cu opt-out).");
          '

      # Numele artifactului poarta SHA-ul real al codului testat (poate diferi de head_sha
      # al rularii cand smoke-ul e dispatch-uit cu input-ul ref); gate-ul de release se
      # ancoreaza pe acest nume, nu pe head_sha.
      - name: Upload staging smoke result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-smoke-result-${{ steps.smokesha.outputs.sha }}
          path: |
            ${{ github.workspace }}/staging-smoke-http.json
            ${{ github.workspace }}/staging-smoke-discord.json
          if-no-files-found: warn
          retention-days: 30
