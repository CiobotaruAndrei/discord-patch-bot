name: Container scan (Trivy + SBOM)

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/package.json"
      - "src/package-lock.json"
      - "src/native/**"
      - ".github/workflows/container-scan.yml"
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Cache-ul de layere scuteste recompilarea libyara/libarchive/qpdf in container la
      # fiecare rulare. ATENTIE: pe rularea programata se dezactiveaza deliberat. Acolo scopul
      # nu e sa verifice o schimbare de cod, ci sa prinda CVE-uri noi aparute intre timp in
      # imaginea de baza; cu layere din cache, `apt-get upgrade` din stage-ul de runtime nu s-ar
      # mai executa si Trivy ar scana o imagine veche, raportand curat pe baza unor pachete pe
      # care productia nu le mai are.
      - name: Build image (local, fara push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: discord-patch-bot:scan
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          # zstd in loc de gzip la exportul de cache. Exportul e al doilea cost al jobului dupa
          # compilarea librariilor C: masurat, 119s cand stratul de dependinte cargo s-a reconstruit
          # si 18s cand totul venea din cache. Continutul cache-ului e identic, doar algoritmul de
          # compresie e altul.
          #
          # Exportul se face DOAR de pe main (si de pe rularea programata), niciodata dintr-un PR.
          # Motivul e cota de 10 GB pe repo: `mode=max` salveaza fiecare layer intermediar ca intrare
          # separata, iar un PR isi scrie propriul scope (`refs/pull/N/merge`), adica o copie
          # integrala a aceluiasi set de layere. Cu cateva PR-uri deschise se depaseste cota, GitHub
          # evacueaza LRU, si exact layerele de care are nevoie rularea urmatoare dispar - build-ul
          # redevine rece (masurat: 356s in loc de ~60s). PR-urile CITESC in continuare cache-ul de pe
          # main prin `cache-from`, iar main il reimprospateaza la fiecare push care atinge Dockerfile,
          # lock-ul de dependinte sau `src/native/**` - adica exact intrarile care il invalideaza.
          #
          # Conditia se scrie cu negatia pe prima pozitie, nu `este_PR && '' || valoare`. In expresiile
          # GitHub sirul gol este falsy, deci acea forma cade mereu pe ramura `||` si exporta cache-ul
          # chiar si din PR-uri - fix situatia pe care o descrie paragraful de mai sus.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,compression=zstd' || '' }}

      # Doua scanari in loc de trei. Trivy pornea de trei ori pe aceeasi imagine — SARIF, SBOM si
      # gate — iar fiecare pornire isi descarca din nou baza de vulnerabilitati: masurat, 14-15s de
      # fiecare data. SARIF-ul si gate-ul folosesc exact aceleasi filtre, deci impart un singur raport
      # si difera doar prin formatul in care e redat, obtinut local cu `trivy convert`.
      #
      # SBOM-ul ramane scanare separata dinadins: `trivy convert` accepta `--severity`, dar NU are
      # `--ignore-unfixed` (verificat pe 0.72.0). Ca sa iasa dintr-un singur raport ar fi trebuit fie
      # sa filtram unfixed la scanare, si atunci SBOM-ul ar fi pierdut vulnerabilitatile fara fix, fie
      # sa reconstruim filtrul intr-o politica Rego. Prima varianta saraceste inventarul, a doua muta
      # un filtru de securitate intr-un fisier separat care poate devia tacut de la ce cere gate-ul.
      - name: Trivy scan (fixabile, raport pentru SARIF si gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: discord-patch-bot:scan
          format: json
          output: trivy-fixable.json
          ignore-unfixed: true
          list-all-pkgs: true

      - name: Converteste raportul in SARIF
        if: always()
        run: trivy convert --format sarif --severity CRITICAL,HIGH --output trivy-results.sarif trivy-fixable.json

      - name: Upload Trivy SARIF to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Generate SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          image-ref: discord-patch-bot:scan
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

      - name: Trivy gate (blocheaza pe CRITICAL/HIGH fixabile)
        run: trivy convert --format table --severity CRITICAL,HIGH --exit-code 1 trivy-fixable.json
