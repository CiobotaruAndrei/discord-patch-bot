name: Container scan (Trivy + SBOM)

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/package.json"
      - "src/package-lock.json"
      - "src/native/**"
      - ".github/workflows/container-scan.yml"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, fara push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: discord-patch-bot:scan

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: discord-patch-bot:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Generate SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: discord-patch-bot:scan
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

      - name: Trivy gate (blocheaza pe CRITICAL/HIGH fixabile)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: discord-patch-bot:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
