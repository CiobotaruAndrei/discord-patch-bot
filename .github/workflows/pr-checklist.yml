name: PR Checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-checklist-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  checklist:
    name: Require PR checklist (docs, teste, no-comments, benchmark, conflict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify PR checklist
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const login = (pr.user && pr.user.login) || "";
            if (login.endsWith("[bot]")) {
              core.info(`Skip checklist pentru PR de la bot: ${login}`);
              return;
            }
            const body = pr.body || "";
            const checked = (keyword) => new RegExp(`-\\s*\\[[xX]\\][^\\n]*${keyword}`).test(body);
            const required = [
              { keyword: "\\*\\*[Dd]ocumentatie\\*\\*", label: "documentatie (CHANGELOG + docs reflecta codul)" },
              { keyword: "\\*\\*[Tt]este\\*\\*", label: "teste (pentru functionalitatea noua)" },
              { keyword: "[Cc]omentarii", label: "fara comentarii in cod / fara secrete commit-uite" },
              { keyword: "\\*\\*[Bb]enchmark\\*\\*", label: "benchmark daca e hot-path / schimbare de limbaj" },
              { keyword: "[Cc]onflict cu", label: "fara conflict cu main (branch nou off main)" }
            ];
            const problems = required.filter(item => !checked(item.keyword)).map(item => `bifa lipsa: ${item.label}`);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            const names = files.map(f => f.filename);
            const { isCode, isDoc, isTest, isInfra } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-checklist-file-classifiers.js`);
            const codeChanged = names.some(isCode);
            const docsChanged = names.some(isDoc);
            const testChanged = names.some(isTest);
            const infraChanged = names.some(isInfra);

            if (codeChanged && !docsChanged) {
              problems.push("ai modificat cod (src/**) dar diff-ul nu atinge niciun fisier de documentatie (.md) — bifa de documentatie nu e sustinuta de diff");
            }
            if (codeChanged && !testChanged) {
              problems.push("ai modificat cod (src/**) dar diff-ul nu atinge niciun fisier de test (src/test/**) — bifa de teste nu e sustinuta de diff");
            }
            if (infraChanged && !docsChanged) {
              problems.push("ai modificat infrastructura/deploy (Dockerfile / .github/workflows / monitoring / config) dar diff-ul nu atinge niciun fisier de documentatie (.md) — schimbarile de infra trebuie reflectate in docs");
            }

            if (problems.length) {
              core.setFailed(`Checklist PR incomplet: ${problems.join("; ")}. Sablonul e in .github/pull_request_template.md.`);
            } else {
              core.info("Checklist PR complet: bifele cheie sunt marcate, iar pentru schimbarile de cod diff-ul atinge documentatie + teste.");
            }
