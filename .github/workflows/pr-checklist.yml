name: PR Checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  checklist:
    name: Require PR checklist (docs, teste, no-comments, benchmark, conflict)
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR checklist
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const login = (pr.user && pr.user.login) || "";
            if (login.endsWith("[bot]")) {
              core.info(`Skip checklist pentru PR de la bot: ${login}`);
              return;
            }
            const body = pr.body || "";
            const checked = (keyword) => new RegExp(`-\\s*\\[[xX]\\][^\\n]*${keyword}`).test(body);
            const required = [
              { keyword: "\\*\\*[Dd]ocumentatie\\*\\*", label: "documentatie (Regula 2)" },
              { keyword: "\\*\\*[Tt]este\\*\\*", label: "teste (Regula 4)" },
              { keyword: "[Cc]omentarii", label: "fara comentarii / fara secrete (Regula 1)" },
              { keyword: "\\*\\*[Bb]enchmark\\*\\*", label: "benchmark daca e hot-path / schimbare de limbaj (Regula 3 + 6)" },
              { keyword: "[Cc]onflict cu", label: "fara conflict cu main (Regula 8 + 9)" }
            ];
            const missing = required.filter(item => !checked(item.keyword)).map(item => item.label);
            if (missing.length) {
              core.setFailed(`Checklist PR incomplet: bifeaza in descrierea PR-ului ${missing.join("; ")}. Sablonul e in .github/pull_request_template.md.`);
            } else {
              core.info("Checklist PR complet (docs + teste + no-comments + benchmark + conflict bifate).");
            }
