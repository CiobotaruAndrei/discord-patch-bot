name: Canary surse

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Fail-closed: un crash complet la getLatestForAllGames/fetchDeals pica workflow-ul.
      # Pentru rulari controlate cu retea instabila se poate seta ALLOW_CANARY_NETWORK_SKIP=true (nu in CI).
      - name: Canary surse (fail-closed pe API fiabile - steam/minecraft/roblox + deals; sursele fragile ruleaza warning-only)
        env:
          MONGO_URI: mongodb://localhost:27017/discord-patch-bot-canary
          DISCORD_TOKEN: canary_token
          DISCORD_CLIENT_ID: canary_client_id
          METRICS_PUBLIC: "true"
        run: npm run canary:sources
