name: Apply source hardening patch

on:
  push:
    branches:
      - codex/implement-hardening-checks

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip source-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implement-hardening-checks
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply focused source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new.strip() in text:
                  return False
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              return True

          replace_once(
              "db.js",
              '''  lastProcessedGameKey: { type: String, default: null },

  // V9: filtre noi
''',
              '''  lastProcessedGameKey: { type: String, default: null },

  updatesInitializing: { type: Boolean, default: false },
  updatesActivationId: { type: String, default: null },
  updatesLastError: {
    message: { type: String, default: "" },
    channelId: { type: String, default: null },
    at: { type: Date, default: null }
  },
  discountsInitializing: { type: Boolean, default: false },
  discountsActivationId: { type: String, default: null },
  discountsLastError: {
    message: { type: String, default: "" },
    channelId: { type: String, default: null },
    at: { type: Date, default: null }
  },

  // V9: filtre noi
'''
          )

          replace_once(
              "commands.js",
              '''  const valid = data.filter(r => r.latest !== null);
  if (!valid.length) {
    endLog("no_data");
    return safeEdit(interaction, "Eroare: Nu am date disponibile.");
  }
  const guild = await getGuildSettings(interaction.guild.id);
  const mode = guild?.notificationMode || "detailed";
''',
              '''  const guild = await getGuildSettings(interaction.guild.id);
  const enabledGames = Array.isArray(guild?.enabledGames) ? guild.enabledGames : [];
  const enabledSet = enabledGames.length > 0 ? new Set(enabledGames) : null;
  const valid = data.filter(r => r.latest !== null && (!enabledSet || enabledSet.has(r.game.key)));
  if (!valid.length) {
    endLog("no_data");
    return safeEdit(
      interaction,
      enabledSet
        ? "Eroare: Nu am date disponibile pentru jocurile active ale acestui server."
        : "Eroare: Nu am date disponibile."
    );
  }
  const mode = guild?.notificationMode || "detailed";
'''
          )

          replace_once(
              "test/commands-regression.test.js",
              '''test("automatic update notifications respect the per-game filter", () => {
  assert.match(commandsSource, /enabledGames/);
  assert.match(commandsSource, /hasGameFilter && !enabledSet\\.has\\(gameKey\\)/);
});
''',
              '''test("automatic update notifications respect the per-game filter", () => {
  assert.match(commandsSource, /enabledGames/);
  assert.match(commandsSource, /hasGameFilter && !enabledSet\\.has\\(gameKey\\)/);
});

test("manual latest updates respects the per-game filter", () => {
  assert.match(commandsSource, /Nu am date disponibile pentru jocurile active ale acestui server/);
  assert.match(commandsSource, /data\\.filter\\(r => r\\.latest !== null && \\(!enabledSet \\|\\| enabledSet\\.has\\(r\\.game\\.key\\)\\)\\)/);
});
'''
          )
          PY

      - name: Install dependencies
        run: npm install

      - name: Run checks
        env:
          MONGO_URI: mongodb://localhost:27017/discord-patch-bot-ci
          DISCORD_TOKEN: dummy-token
          DISCORD_CLIENT_ID: dummy-client-id
          METRICS_PUBLIC: "true"
          NODE_ENV: test
        run: npm run check

      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet -- db.js commands.js test/commands-regression.test.js; then
            echo "No source patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db.js commands.js test/commands-regression.test.js
          git commit -m "Harden guild state and manual update filters [skip source-patch]"
          git push origin HEAD:codex/implement-hardening-checks
