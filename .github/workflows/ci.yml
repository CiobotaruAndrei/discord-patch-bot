name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Jobul rapid, fara Rust. Ruleaza in paralel cu `check` si da feedback in ~40s pe cea mai
  # frecventa clasa de esec: gate-uri structurale, tipare, comentarii, straturi.
  #
  # De ce NU e o copie a lui `check` impartita in doua: `check` are 62,8s cost fix (container Mongo,
  # apt, toolchain Rust, cache, npm ci) inaintea primului pas util. Doua joburi care au amandoua
  # nevoie de Rust l-ar plati de doua ori, pentru ~40s de wall-clock castigat si ~63s de runner in
  # plus - iar castigul real e mai mic, fiindca `check:native` si `npm run check` impart acelasi
  # target/<triplet>/release si separate ar recompila aceleasi artefacte. Jobul asta castiga tocmai
  # fiindca NU plateste costul fix: fara Rust, fara librarii C, fara Mongo (gate-urile ruleaza fara
  # addon-ul nativ, verificat mutand .node-ul). Masuratorile pe pasi, cu run id si data, plus pragul
  # la care decizia merita re-discutata: docs/architecture/ci-timings.md.
  gates:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build:ts

      - name: Structural gates + lint
        run: npm run check:gates:prebuilt && npm run lint:prebuilt

  check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Pachetele insumeaza ~48 MB, iar mirror-ul Azure e inegal: masurat, aceeasi lista se instaleaza
      # in 23s cand merge bine, dar `cmake` a luat 89s si `libclang-dev` a blocat 3,5 minute intr-o
      # rulare care a expirat. Cache-ul pastreaza arhivele .deb, deci la hit `apt-get install` le
      # gaseste local si nu mai descarca nimic. Cheia poarta lista de pachete: daca se schimba, cache-ul
      # se invalideaza singur.
      #
      # Salvarea e conditionata pe main, ca la celelalte cache-uri din repo: cota Actions e 10 GB,
      # iar o copie per branch ar evacua LRU exact intrarile de care depinde rularea urmatoare.
      - name: Restore cache pachete apt (arhive .deb)
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-noble-${{ hashFiles('.github/workflows/native-apt-packages.txt') }}

      - name: Install native library dependencies (libarchive + libyara + libseccomp build deps)
        timeout-minutes: 10
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer unattended-upgrades.service 2>/dev/null || true
          packages="$(paste -sd' ' .github/workflows/native-apt-packages.txt)"
          if [ -d ~/apt-archives ]; then
            sudo mkdir -p /var/cache/apt/archives
            sudo cp -n ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          for attempt in 1 2 3; do
            sudo apt-get -o DPkg::Lock::Timeout=120 update && sudo apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends $packages && break
            echo "apt-get a esuat sau a fost intrerupt (incercarea $attempt din 3); se reia"
            sleep 10
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
          done
          mkdir -p ~/apt-archives
          sudo cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - name: Salveaza cache-ul de pachete apt
        if: github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-noble-${{ hashFiles('.github/workflows/native-apt-packages.txt') }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master 2026-06
        with:
          toolchain: "1.96.0"
          components: clippy

      # Fara acest cache fiecare rulare recompileaza de la zero libyara, libarchive (CMake)
      # si qpdf (~100 fisiere .cc), plus zlib/libjpeg vendorate: ~4 minute per rulare, care
      # cresc cu fiecare librarie nativa adaugata. Cheia e derivata din Cargo.lock, deci o
      # schimbare de dependinte invalideaza corect cache-ul.
      #
      # `save-if` limiteaza SCRIEREA la main. Intrarea are ~400 MB, iar fara restrictie fiecare
      # branch isi salva propria copie: masurat, 14 copii = 4,2 GB din cota de 10 GB pe repo. Odata
      # depasita cota, GitHub evacueaza LRU si arunca fix intrarile de care depinde rularea urmatoare.
      # Citirea ramane deschisa tuturor branch-urilor, iar main reimprospateaza intrarea la fiecare
      # push, deci un PR pleaca mereu de la ultimul main.
      - name: Cache Rust build (dependinte + librarii C compilate din surse)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src/native
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      - name: Validate Rust (clippy + tests, profil release - partajeaza target cache cu napi build din check)
        run: npm run check:native

      - name: Run project checks
        env:
          MONGO_URI: mongodb://localhost:27017/discord-patch-bot-test
          DISCORD_TOKEN: test_discord_token
          DISCORD_CLIENT_ID: test_discord_client_id
          METRICS_PUBLIC: "true"
        run: npm run check

      - name: Benchmark hot-path guard (BENCHMARKS.md)
        env:
          BENCH_GUARD_REQUIRE_NATIVE: "true"
        run: npm run benchmark:guard:prebuilt

      - name: Run e2e tests explicitly (guard impotriva putrezirii scriptului test:e2e, fara rebuild - check a construit deja dist)
        env:
          MONGO_URI: mongodb://localhost:27017/discord-patch-bot-test
          DISCORD_TOKEN: test_discord_token
          DISCORD_CLIENT_ID: test_discord_client_id
        run: npm run test:e2e:prebuilt

  # Un singur check agregat pentru protectia de branch: daca oricare job cade, cade si asta.
  # `if: always()` e obligatoriu - fara el, jobul ar fi sarit cand un dependinte esueaza, si
  # protectia de branch ar vedea "skipped", nu "failed".
  ci:
    needs: [gates, check]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Rezultatul agregat al CI
        env:
          GATES: ${{ needs.gates.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          echo "gates=$GATES check=$CHECK"
          if [ "$GATES" != "success" ] || [ "$CHECK" != "success" ]; then
            echo "::error::CI a esuat (gates=$GATES, check=$CHECK)"
            exit 1
          fi
