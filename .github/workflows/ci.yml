name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install native library dependencies (libarchive + libyara + libseccomp build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev libseccomp-dev libmagic-dev libssl-dev zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev libxml2-dev libacl1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master 2026-06
        with:
          toolchain: "1.96.0"
          components: clippy

      # Fara acest cache fiecare rulare recompileaza de la zero libyara, libarchive (CMake)
      # si qpdf (~100 fisiere .cc), plus zlib/libjpeg vendorate: ~4 minute per rulare, care
      # cresc cu fiecare librarie nativa adaugata. Cheia e derivata din Cargo.lock, deci o
      # schimbare de dependinte invalideaza corect cache-ul.
      - name: Cache Rust build (dependinte + librarii C compilate din surse)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src/native
          cache-on-failure: "true"

      - name: Install dependencies
        run: npm ci

      - name: Validate Rust (clippy + tests, profil release - partajeaza target cache cu napi build din check)
        run: npm run check:native

      - name: Run project checks
        env:
          MONGO_URI: mongodb://localhost:27017/discord-patch-bot-test
          DISCORD_TOKEN: test_discord_token
          DISCORD_CLIENT_ID: test_discord_client_id
          METRICS_PUBLIC: "true"
        run: npm run check

      - name: Benchmark hot-path guard (BENCHMARKS.md)
        env:
          BENCH_GUARD_REQUIRE_NATIVE: "true"
        run: node dist/scripts/benchmarkGuard.js

      - name: Run e2e tests explicitly (guard impotriva putrezirii scriptului test:e2e, fara rebuild - check a construit deja dist)
        env:
          MONGO_URI: mongodb://localhost:27017/discord-patch-bot-test
          DISCORD_TOKEN: test_discord_token
          DISCORD_CLIENT_ID: test_discord_client_id
        run: npm run test:e2e:prebuilt
