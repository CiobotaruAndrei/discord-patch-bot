name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Print generated lockfile chunks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = fs.readFileSync('package-lock.json', 'base64');
          console.log('LOCKFILE_B64_START');
          for (let i = 0; i < data.length; i += 3000) {
            console.log(`LOCKFILE_B64_CHUNK:${data.slice(i, i + 3000)}`);
          }
          console.log('LOCKFILE_B64_END');
          NODE
