name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: src/package-lock.json

      - name: Run project checks
        env:
          MONGO_URI: mongodb://localhost:27017/discord-patch-bot-test
          DISCORD_TOKEN: test_discord_token
          DISCORD_CLIENT_ID: test_discord_client_id
          METRICS_PUBLIC: "true"
        run: npm run check
