name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-06
        with:
          toolchain: "1.96.0"
          components: clippy

      - name: Install dependencies
        run: npm ci

      - name: Validate Rust (clippy + tests)
        run: |
          cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path native/Cargo.toml --quiet

      - name: Run project checks
        env:
          MONGO_URI: mongodb://localhost:27017/discord-patch-bot-test
          DISCORD_TOKEN: test_discord_token
          DISCORD_CLIENT_ID: test_discord_client_id
          METRICS_PUBLIC: "true"
        run: npm run check

      - name: Benchmark hot-path guard (BENCHMARKS.md)
        env:
          BENCH_GUARD_REQUIRE_NATIVE: "true"
        run: node dist/scripts/benchmarkGuard.js

      - name: Run e2e tests explicitly (guard impotriva putrezirii scriptului test:e2e)
        env:
          MONGO_URI: mongodb://localhost:27017/discord-patch-bot-test
          DISCORD_TOKEN: test_discord_token
          DISCORD_CLIENT_ID: test_discord_client_id
        run: npm run test:e2e
