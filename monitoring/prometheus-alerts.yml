groups:
  - name: discord-patch-bot-outbox
    rules:
      - alert: OutboxQueueDepthHigh
        expr: bot_outbox_queue_depth > 100
        for: 10m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox queue depth high (> 100 for 10m)"
          description: "bot_outbox_queue_depth a stat peste 100 timp de 10m. Drenarea nu tine pasul. Vezi OPERATIONS.md - sectiunea 'Cand creste bot_outbox_queue_depth'."

      - alert: OutboxDrainStale
        expr: bot_outbox_last_drain_age_seconds > 300
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox drain stale (no completed drain in >5m)"
          description: "bot_outbox_last_drain_age_seconds > 300: worker-ul nu a finalizat o drenare de peste 5m (pe pauza prin /outbox pause, client Discord ne-ready, Mongo neconectat, sau lock detinut de alta instanta). Metricile de coada pot fi invechite. Vezi OPERATIONS.md."

      - alert: OutboxOldestJobAgeHigh
        expr: bot_outbox_oldest_job_age_seconds > 600
        for: 10m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Oldest outbox job older than 10 minutes"
          description: "bot_outbox_oldest_job_age_seconds > 600 timp de 10m. Joburile nu se livreaza (canal/permisiuni/Discord) sau drenarea e pe pauza. Vezi OPERATIONS.md."

      - alert: OutboxMarkSentFailures
        expr: increase(bot_outbox_mark_sent_failures[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox mark-sent failures (re-send risk)"
          description: "bot_outbox_mark_sent_failures a crescut in ultimele 15m: mesaje trimise dar nemarcate in istoricul de dedupe. Vezi OPERATIONS.md - 'Cand creste bot_outbox_mark_sent_failures'."

      - alert: OutboxDeleteFailures
        expr: increase(bot_outbox_delete_failures[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox job delete failures (Mongo write issues)"
          description: "bot_outbox_delete_failures a crescut in ultimele 15m: job-uri procesate care nu s-au putut sterge din coada (raman deduse/reluate). Verifica disponibilitatea Mongo. Vezi OPERATIONS.md - admin alert outbox:delete."

      - alert: OutboxDeadLetterWriteFailures
        expr: increase(bot_outbox_deadletter_write_failures[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox dead-letter audit write failures"
          description: "bot_outbox_deadletter_write_failures a crescut in ultimele 15m: scrieri de audit dead-letter esuate. Pe caile terminale job-ul e pastrat pentru replay; pentru un job deja livrat e sters fara audit (coreleaza cu bot_outbox_mark_sent_failures). Verifica Mongo. Vezi OPERATIONS.md - admin alert outbox:deadletter-write."

      - alert: OutboxJobsExpired
        expr: increase(bot_outbox_expired[1h]) > 0
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox jobs dead-lettered due to age (nelivrate inainte de TTL)"
          description: "bot_outbox_expired a crescut: joburi au stat in coada pana aproape de TTL-ul de 7 zile fara sa fie livrate si au fost mutate in dead-letter (in loc sa fie sterse tacut de TTL). Investigheaza de ce nu s-au drenat (outbox dezactivat/pe pauza mult timp, canal stricat, worker oprit). Vezi OPERATIONS.md - 'Migrari... outbox' / sectiunea de dead-letter."

      - alert: OutboxRecoveryVerifyFailures
        expr: increase(bot_outbox_recovery_verify_failures[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox recovery-verify cannot read channel history"
          description: "bot_outbox_recovery_verify_failures a crescut: lipseste probabil permisiunea Read Message History. Vezi OPERATIONS.md - 'Cand creste bot_outbox_recovery_verify_failures'."

      - alert: OutboxLockAcquireFailures
        expr: increase(bot_outbox_lock_acquire_failures[15m]) > 5
        for: 10m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox drain lock contention"
          description: "bot_outbox_lock_acquire_failures a crescut sustinut: lock-ul outbox_drain e detinut de alta instanta sau nu se elibereaza. Asigura o singura instanta sau verifica TTL-ul lock-ului. Vezi OPERATIONS.md."

      - alert: OutboxDeadLetteredGrowing
        expr: increase(bot_outbox_dead_lettered[1h]) > 0
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: "Outbox deliveries reaching dead-letter"
          description: "bot_outbox_dead_lettered a crescut in ultima ora: livrari esuate definitiv. Inspecteaza cu /outbox deadletters si verifica permisiunile canalului. Vezi OPERATIONS.md - 'Dead-letter'."

      - alert: OutboxRecoveryMarkerMissingHigh
        expr: increase(bot_outbox_recovery_marker_missing[30m]) > 3
        for: 10m
        labels:
          severity: info
          component: outbox
        annotations:
          summary: "Recovery-verify re-sending (marker not found)"
          description: "bot_outbox_recovery_marker_missing crescut: verificarea pe istoric reuseste dar marker-ul nu e gasit (re-trimitere). Pe canale aglomerate creste NOTIFICATION_OUTBOX_RECOVERY_HISTORY_LIMIT. Vezi OPERATIONS.md."

      - alert: OutboxBatchDrainRecommended
        expr: bot_outbox_queue_depth > 500 and bot_outbox_last_drain_age_seconds < 120
        for: 2h
        labels:
          severity: info
          component: outbox
        annotations:
          summary: "Outbox backlog chronic while actively draining (consider batch claim)"
          description: "bot_outbox_queue_depth a stat peste 500 timp de 2h in timp ce worker-ul chiar dreneaza (bot_outbox_last_drain_age_seconds mic), deci drenarea job-by-job nu mai tine pasul la volumul real - nu e o pauza/lock. Este pragul de declansare pentru optimizarea de batch claim/bulkWrite. Vezi ROADMAP.md - 'Outbox: claim in batch'."

  - name: discord-patch-bot-native
    rules:
      - alert: NativeFallbackActive
        expr: increase(bot_native_fallback_total[30m]) > 0
        for: 10m
        labels:
          severity: warning
          component: native
        annotations:
          summary: "Native (Rust) addon falling back to TypeScript"
          description: "bot_native_fallback_total a crescut: unul sau mai multe apeluri native (Rust) arunca exceptii si cad pe implementarea TypeScript. Risc de divergenta de rezultat/performanta. Verifica build-ul nativ (`npm run build:rust`) si log-urile [NATIVE_FUZZY]."
